services:

  # 2. Bộ nhớ đệm & Lưu trữ Session tạm thời: Redis
  redis:
    image: redis:7-alpine
    container_name: lms_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - lms_network

  # 2b. Lưu trữ đối tượng tương thích S3: MinIO
  minio:
    image: minio/minio:RELEASE.2024-01-28T22-35-53Z
    container_name: lms_minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - lms_network

  # 3. Ứng dụng Backend API: FastAPI (Python)
  web:
    build: .
    container_name: lms_fastapi_app
    restart: always
    # Sử dụng cờ --reload và mount volumes giúp tự động phát hiện code thay đổi trên máy thật và reload container lập tức
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DOCKER_DATABASE_URL}
      - APP_NAME=LMS Backend (Docker Environment)
      - APP_ENV=${APP_ENV:-production}
      - SECRET_KEY=${SECRET_KEY}
      - ENABLE_MOCK_PAYMENTS=${ENABLE_MOCK_PAYMENTS:-false}
      - PAYMENT_WEBHOOK_SECRET=${PAYMENT_WEBHOOK_SECRET}
      - MINIO_ENDPOINT_URL=http://minio:9000
      - MINIO_PUBLIC_URL=http://localhost:9000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - minio
    networks:
      - lms_network

# 4. Định nghĩa các phân vùng lưu trữ bền vững (Persistent Volumes) giúp tránh mất dữ liệu khi tắt container
volumes:
  redis_data:
  minio_data:

# 5. Thiết lập mạng nội bộ phân giải DNS nội bộ giữa các service
networks:
  lms_network:
    driver: bridge
