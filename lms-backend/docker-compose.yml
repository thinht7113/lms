services:

  redis:
    image: redis:7-alpine
    container_name: lms_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - lms_network

  minio:
    image: minio/minio:RELEASE.2024-01-28T22-35-53Z
    container_name: lms_minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - lms_network

  web:
    build: .
    container_name: lms_fastapi_app
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DOCKER_DATABASE_URL}
      - REDIS_URL=${DOCKER_REDIS_URL:-redis://redis:6379/0}
      - APP_NAME=LMS Backend (Docker Environment)
      - APP_ENV=${APP_ENV:-production}
      - SECRET_KEY=${SECRET_KEY}
      - ENABLE_MOCK_PAYMENTS=${ENABLE_MOCK_PAYMENTS:-false}
      - PAYMENT_WEBHOOK_SECRET=${PAYMENT_WEBHOOK_SECRET}
      - MINIO_ENDPOINT_URL=http://minio:9000
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL:-http://localhost:9000}
      - CORS_ORIGINS=${CORS_ORIGINS}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - minio
    networks:
      - lms_network

volumes:
  redis_data:
  minio_data:

networks:
  lms_network:
    driver: bridge
