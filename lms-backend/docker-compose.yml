services:

  db:
    image: postgres:16-alpine
    container_name: lms_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: lms_database
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: postgres -c max_connections=250
    networks:
      - lms_network

  redis:
    image: redis:7-alpine
    container_name: lms_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - lms_network

  minio:
    image: minio/minio:latest
    container_name: lms_minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadminpassword}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - lms_network

  web:
    build: .
    container_name: lms_fastapi_app
    restart: always
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_POOL_SIZE=${DATABASE_POOL_SIZE:-5}
      - DATABASE_MAX_OVERFLOW=${DATABASE_MAX_OVERFLOW:-2}
      - DATABASE_POOL_TIMEOUT_SECONDS=${DATABASE_POOL_TIMEOUT_SECONDS:-30}
      - DATABASE_POOL_RECYCLE_SECONDS=${DATABASE_POOL_RECYCLE_SECONDS:-900}
      - DATABASE_CONNECT_TIMEOUT_SECONDS=${DATABASE_CONNECT_TIMEOUT_SECONDS:-10}
      - DATABASE_COMMAND_TIMEOUT_SECONDS=${DATABASE_COMMAND_TIMEOUT_SECONDS:-60}
      - REDIS_URL=${DOCKER_REDIS_URL:-redis://redis:6379/0}
      - APP_NAME=LMS Backend (Docker Environment)
      - APP_ENV=${APP_ENV:-development}
      - SECRET_KEY=${SECRET_KEY}
      - ENABLE_MOCK_PAYMENTS=${ENABLE_MOCK_PAYMENTS:-false}
      - PAYMENT_WEBHOOK_SECRET=${PAYMENT_WEBHOOK_SECRET}
      - MINIO_ENDPOINT_URL=http://minio:9000
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL:-http://localhost:9000}
      - CORS_ORIGINS=${CORS_ORIGINS}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - lms_network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  lms_network:
    driver: bridge
